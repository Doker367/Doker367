<text x="208" y="111" fill="#62d8e8" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" text-anchor="start">143</text>
<text x="208" y="138" fill="#b3c7d4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Días con actividad</text>
