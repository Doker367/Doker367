<svg xmlns="http://www.w3.org/2000/svg" width="390" height="294" viewBox="0 0 390 294" role="img" aria-labelledby="title description"><title id="title">GitHub Milestones</title><desc id="description">Hitos calculados con el calendario real de contribuciones del último año.</desc>
