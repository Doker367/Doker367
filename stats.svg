<text x="36" y="48" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" text-anchor="start">GitHub en cifras</text>
<text x="36" y="130" fill="#62d8e8" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="bold" text-anchor="start">46</text>
<text x="36" y="161" fill="#b3c7d4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Repositorios públicos</text>
