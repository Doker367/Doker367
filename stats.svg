<text x="36" y="218" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Lenguajes de repositorios: JavaScript, Python, TypeScript, HTML, Dart</text>
