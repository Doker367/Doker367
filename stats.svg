<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="248" viewBox="0 0 1000 248" role="img" aria-labelledby="title description"><title id="title">GitHub en cifras</title><desc id="description">Repositorios públicos, estrellas y seguidores obtenidos de la API de GitHub.</desc>
