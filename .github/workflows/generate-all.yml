name: Generate All Profile Assets

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate_cards.py
      - scripts/style_snake.py
      - .github/workflows/generate-all.yml
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate GitHub statistics
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: dist
        run: python3 scripts/generate_cards.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23a93265&color_dots=%23d7e5eb,%23aec7df,%23719fc7,%232796ae,%233bad82,%23bc862b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff8db4&color_dots=%23263650,%234e6daa,%23407fad,%2328b1bf,%236ad4a0,%23f6ca69

      - name: Apply profile styling to snake SVGs
        run: python3 scripts/style_snake.py dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh snake images used by the README
        if: github.ref == 'refs/heads/main'
        run: |
          cp dist/github-snake.svg assets/github-snake.svg
          cp dist/github-snake-dark.svg assets/github-snake-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GitHub contribution snake"
            git push origin HEAD:main
          fi
